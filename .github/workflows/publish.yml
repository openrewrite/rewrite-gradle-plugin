---
name: publish

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+

env:
  GRADLE_ENTERPRISE_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
  # Resolve org.openrewrite and io.moderne dependencies from the Code Genome Project. Empty when the
  # secrets are unset, which leaves the codegenome repository out of the build entirely.
  ORG_GRADLE_PROJECT_codegenomeUsername: ${{ secrets.CGP_ARTIFACTS_MAVEN_USERNAME }}
  ORG_GRADLE_PROJECT_codegenomePassword: ${{ secrets.CGP_ARTIFACTS_MAVEN_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          develocity-access-key: ${{ env.GRADLE_ENTERPRISE_ACCESS_KEY }}

      - name: publish-candidate
        if: contains(github.ref, '-rc.')
        run: |
          ./gradlew \
            -Preleasing \
            -Prelease.disableGitChecks=true \
            -Prelease.useLastTag=true \
            -Dgradle.publish.key=${{ secrets.GRADLE_PUBLISH_KEY }} \
            -Dgradle.publish.secret=${{ secrets.GRADLE_PUBLISH_SECRET }} \
            candidate \
            publishPlugins

      - name: publish-release
        if: (!contains(github.ref, '-rc.'))
        run: |
          ./gradlew \
            -Preleasing \
            -Prelease.disableGitChecks=true \
            -Prelease.useLastTag=true \
            -Dgradle.publish.key=${{ secrets.GRADLE_PUBLISH_KEY }} \
            -Dgradle.publish.secret=${{ secrets.GRADLE_PUBLISH_SECRET }} \
            final \
            publishPlugins
