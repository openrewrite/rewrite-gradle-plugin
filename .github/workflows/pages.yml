---
name: Deploy plugin docs to Pages

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["publish"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_ENTERPRISE_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
      ORG_GRADLE_PROJECT_codegenomeUsername: ${{ secrets.CODEGENOME_USERNAME }}
      ORG_GRADLE_PROJECT_codegenomePassword: ${{ secrets.CODEGENOME_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          develocity-access-key: ${{ env.GRADLE_ENTERPRISE_ACCESS_KEY }}

      - name: Generate documentation
        run: ./gradlew :plugin:generatePluginReference :plugin:javadoc

      - name: Assemble site
        run: |
          version=$(git ls-remote --tags --refs --sort=-v:refname origin 'v*' | grep -v -- '-rc\.' | head -1 | sed 's|.*refs/tags/v||')
          mkdir -p site/apidocs
          sed "s/X\.Y\.Z/$version/g" docs/plugin-reference.md > site/index.md
          sudo apt-get install -y pandoc
          pandoc site/index.md --standalone --template docs/template.html \
            --shift-heading-level-by=-1 --toc --toc-depth=2 \
            --variable version="$version" --css style.css -o site/index.html
          cp docs/style.css docs/logo-*.svg site/
          cp -r plugin/build/docs/javadoc/* site/apidocs/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
