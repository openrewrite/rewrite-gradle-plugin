---
name: ci

on:
  push:
    branches:
      - main
    tags-ignore:
      - "*"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    - cron: 0 17 * * *

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_SWITCHES: --console=plain --info --stacktrace --warning-mode=all --no-daemon
  GRADLE_ENTERPRISE_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
  # Resolve org.openrewrite and io.moderne dependencies from the Code Genome Project. Empty when the
  # secrets are unset, which leaves the codegenome repository out of the build entirely.
  ORG_GRADLE_PROJECT_codegenomeUsername: ${{ secrets.CODEGENOME_USERNAME }}
  ORG_GRADLE_PROJECT_codegenomePassword: ${{ secrets.CODEGENOME_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: setup-gradle
        uses: gradle/actions/setup-gradle@v5
      - name: build
        run: ./gradlew ${{ env.GRADLE_SWITCHES }} build
      - name: publish-snapshots
        if: github.event_name != 'pull_request'
        run: ./gradlew ${{ env.GRADLE_SWITCHES }} snapshot :plugin:publishPluginMavenPublicationToCgpRepository -x test
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CGP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CGP_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-west-2
          # Gradle's own s3:// transport still bundles AWS SDK for Java 1.x, which prints a
          # deprecation banner with a stack trace on every upload. Drop once Gradle ships
          # https://github.com/gradle/gradle/pull/29686 (milestone 9.8.0).
          AWS_JAVA_V1_DISABLE_DEPRECATION_ANNOUNCEMENT: true

  notify:
    if: (failure() || cancelled()) && github.event_name == 'schedule' && (github.repository_owner == 'openrewrite' || github.repository_owner == 'moderneinc')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Slack notify on failure
        uses: slackapi/slack-github-action@v3
        continue-on-error: true
        with:
          webhook: ${{ secrets.OPS_GITHUB_ACTIONS_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ CI run failed for `${{ github.repository }}` - <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
